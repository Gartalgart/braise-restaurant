<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;overflow:hidden;background:#15110e;color:#f2e9da;font-family:Georgia,serif}
  .hero{position:absolute;inset:0;background:linear-gradient(rgb(21 17 14/.35),rgb(21 17 14/.75)),url(https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1900&q=80) center/cover}
  header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:32px 64px;font-family:Arial,sans-serif;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
  nav{display:flex;gap:40px}
  .center{position:absolute;left:0;right:0;top:330px;text-align:center}
  h1{font-size:120px;font-weight:400;letter-spacing:.04em}
  p{margin-top:18px;font-size:24px;font-style:italic;color:#d9cdb8}
  .rule{width:80px;height:1px;background:#b8935a;margin:28px auto}
  .cta{display:inline-block;margin-top:10px;border:1px solid #b8935a;padding:18px 44px;font-family:Arial,sans-serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#b8935a}
</style></head><body>
<div class="hero"></div>
<header><span style="font-family:Georgia,serif;font-size:28px;letter-spacing:.1em">BRAISE</span><nav><span>Menu</span><span>Galerie</span><span>Avis</span><span>Contact</span></nav><span style="color:#b8935a">Réserver</span></header>
<div class="center"><h1>Braise</h1><div class="rule"></div><p>Cuisine de saison au feu de bois — Lille</p><a class="cta">Réserver une table</a></div>
</body></html>
