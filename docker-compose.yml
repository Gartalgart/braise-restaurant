services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://braise:${DB_PASSWORD:?DB_PASSWORD manquant dans .env}@db:5432/braise
      DATABASE_URL_UNPOOLED: postgresql://braise:${DB_PASSWORD:?DB_PASSWORD manquant dans .env}@db:5432/braise
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    # Publié sur la boucle locale uniquement (prisma db push, seed, dev) : jamais sur 0.0.0.0
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: braise
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      POSTGRES_DB: braise
    volumes:
      - braise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  braise_pgdata:
