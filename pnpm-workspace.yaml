# Scripts d'installation autorisés (Prisma télécharge ses moteurs, sharp ses binaires).
# allowBuilds : pnpm 11 ; onlyBuiltDependencies : pnpm 9/10 (utilisé par Vercel).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
